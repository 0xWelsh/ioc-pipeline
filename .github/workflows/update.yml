name: Update IoC Feeds

on:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Collector
        run: go run ./cmd/collector/main.go

      - name: Commit updated IoCs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily IoC feed refresh"
          file_pattern: data/processed/**/*.json web/public/iocs/**/*.json

      - name: Upload IoC outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ioc-outputs
          path: |
            data/processed/**/*.json
            web/public/iocs/**/*.json
          if-no-files-found: error
