name: Update IoC Feeds
on:
  schedule:
    - cron: "0 2 * * *" # Daily 02:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run Collector
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          # VT free tier: 4 lookups/min — keep VT_MIN_INTERVAL_MS >= 15000
          VT_MIN_INTERVAL_MS: "16000"
          ENRICH_MAX: "10"
          ENRICH_SLEEP_MS: "2000"
        run: go run ./cmd/collector/main.go

      - name: Commit updated IoCs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: daily IoC feed refresh"
          file_pattern: data/processed/**/*.json web/public/iocs/**/*.json
